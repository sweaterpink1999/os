# ============================================
#  File: xray-limits.conf
#  Tujuan: Meningkatkan stabilitas Xray, Nginx, SSH, Dropbear, WS
#  Optimized for: 100 - 1000 active users
#  Lokasi aktif: /etc/security/limits.d/xray-limits.conf
# ============================================

# ======================================================
# General limits untuk semua user & service
# ======================================================
* soft nofile 500000
* hard nofile 500000
* soft nproc 500000
* hard nproc 500000

# ======================================================
# Khusus untuk root & service penting (systemd, nginx, xray, dropbear, ssh)
# ======================================================
root soft nofile 500000
root hard nofile 500000
root soft nproc 500000
root hard nproc 500000
nginx soft nofile 500000
nginx hard nofile 500000
xray soft nofile 500000
xray hard nofile 500000
dropbear soft nofile 500000
dropbear hard nofile 500000
sshd soft nofile 500000
sshd hard nofile 500000

# ======================================================
# Catatan:
# - nofile = jumlah maksimal file/koneksi/socket yang bisa dibuka
# - nproc  = jumlah maksimal proses yang bisa dijalankan
# - Disarankan 500000 di VPS 1–2GB RAM; bisa dinaikkan ke 1000000 untuk VPS besar.
# - Tidak perlu edit override.conf manual; systemd otomatis membaca limit ini.
# ======================================================
